name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token. gitleaks-action needs to read PR commits on
# pull_request events; without this it 403s ("Resource not accessible by
# integration").
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: build / typecheck / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Audit production deps (informational)
        run: npm audit --omit=dev
        continue-on-error: true
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Build (vite)
        run: npm run build
      # The leaderboard Worker deploys by hand (worker/README.md), so nothing
      # else would notice a broken wrangler.toml, a bad binding, or a worker
      # import that doesn't bundle until deploy day. --dry-run bundles + checks
      # the config without credentials or any network write. Pinned version.
      # (Unknown config keys are only warnings, so it won't catch a typo'd
      # optional key — it catches what would fail the real deploy.)
      - name: Validate worker (wrangler deploy --dry-run)
        run: npx --yes wrangler@4.139.0 deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run" -c worker/wrangler.toml
        env:
          WRANGLER_SEND_METRICS: 'false'

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Run tests (vitest)
        run: npm test

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits on the branch
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
