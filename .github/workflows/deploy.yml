name: deploy

# Auto-publish the site to GitHub Pages on every push to main (i.e. after a PR
# merges). `configure-pages` with enablement: true turns Pages ON automatically
# on the first run (source = GitHub Actions), so no manual toggle is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Build (vite)
        run: npm run build
        env:
          # PUBLIC client config from repo Variables (Settings → Secrets and
          # variables → Actions → Variables) — it ships in client JS, so a
          # Variable (not a Secret) is correct. The deployed leaderboard +
          # streaks worker URL (worker/README.md). Unset → the standing line is
          # omitted and streaks stay local-only; the build still succeeds.
          # If this URL ever changes, ALSO update the `connect-src` origin in
          # index.html's Content-Security-Policy (pinned by src/csp.test.ts) —
          # the browser blocks the submit otherwise, silently.
          VITE_LEADERBOARD_ENDPOINT: ${{ vars.VITE_LEADERBOARD_ENDPOINT }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
