# Dependabot version updates.
#
# Vulnerability alerts and automatic security-fix PRs are enabled in the repo
# settings and are SEPARATE from this file — they fire whenever an advisory
# lands, regardless of the schedule below.
#
# Grouping is the point here: this is a solo repo where every PR costs a CI run
# and a review, so routine minor/patch bumps arrive as ONE pull request, not one
# per package. Majors deliberately fall outside the groups and get their own PR,
# because those are the ones that need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # The workflows pin actions by commit SHA (with a version comment) — Dependabot
  # updates both the SHA and the comment, so the pinning survives.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - '*'
